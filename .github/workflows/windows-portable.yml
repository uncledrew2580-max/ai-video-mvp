name: Windows Portable RC (x64)

# P14-A1: build a Windows x64 portable RC on a real Windows runner.
# Mac is only the command machine — native modules are built here on Windows
# (never hard-copied from macOS). No installer/MSI, portable zip only.
# Trigger manually (workflow_dispatch) or on changes to the CI itself.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'scripts/win/**'
      - 'prompts/**'
      - '版本测试/prompts/**'
      - '正式导入文件/iteration-v1/**'
      - 'desktop/win-main.cjs'
      - 'electron-builder-win.json'
      - 'tests/nonpaid/p14-windows-final-merge.test.mjs'
      - 'tests/nonpaid/p14-windows-config-init.test.mjs'
      - 'tests/nonpaid/p14-windows-output-dirs.test.mjs'
      - 'tests/nonpaid/p14-windows-desktop-shell.test.mjs'
      - 'tests/nonpaid/p14b7-windows-config-sqlite.test.mjs'
      - 'tests/nonpaid/p14b8g-workflow-sync-fk.test.mjs'
      - 'tests/nonpaid/p14c2-windows-business-assets.test.mjs'
      - 'lib/sqlite-exec.mjs'
      - 'client/launcher.mjs'
      - '版本测试/serve-review-assets.mjs'
      - 'scripts/bootstrap-ai-video-workflows.mjs'
      - 'sync_iteration_v1_workflows_to_db.mjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_VERSION: 24.14.0
      NODE_EXE_SHA256: 63c259c81e5d472b5f11c8d506070130cb04a1ecf84b80377a34ed6ec9048088
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pin Python 3.11 for node-gyp: Python 3.12 removed distutils, which
      # node-gyp@8.x imports during configure. 3.11 still ships distutils.
      - name: Setup Python 3.11 (node-gyp toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install win32-x64 native modules (npm ci --include=optional, ON Windows)
        shell: pwsh
        env:
          # Force optional platform packages (e.g. @img/sharp-win32-x64) to install,
          # and steer prebuilt selection at win32-x64 so sharp uses its prebuilt
          # binary instead of falling back to a node-gyp source build.
          npm_config_include: optional
          npm_config_platform: win32
          npm_config_arch: x64
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: npm ci --include=optional

      - name: sharp smoke test (prebuilt loaded, not source-built)
        shell: pwsh
        run: |
          node -e "const s=require('sharp'); console.log('sharp versions:', JSON.stringify(s.versions))"
          if (-not (Test-Path 'node_modules/@img/sharp-win32-x64')) { Write-Error '@img/sharp-win32-x64 not installed'; exit 1 }
          Write-Host '@img/sharp-win32-x64 present OK'

      # Note: native-module win32-x64 verification runs LATER against the filtered
      # portable staging tree (after assemble), not the raw install tree — some
      # packages legitimately ship multi-platform prebuilds that we strip at staging.

      - name: Fetch official Windows node.exe (+ verify SHA256)
        shell: pwsh
        run: node scripts/win/fetch-node-exe.mjs

      # Build a CLEAN LGPL ffmpeg.exe from source via MSYS2/mingw64, using the
      # SAME minimal flags as the frozen Mac 0010 build. This guarantees the
      # configuration string contains NO gpl/nonfree/libx264/libx265/libfdk tokens.
      - name: Setup MSYS2 (mingw64) for ffmpeg
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            make
            diffutils

      - name: Build clean LGPL ffmpeg.exe from source
        shell: msys2 {0}
        run: bash scripts/win/build-ffmpeg-lgpl.sh

      - name: Verify ffmpeg.exe license (configuration clean LGPL)
        shell: pwsh
        run: node scripts/win/verify-ffmpeg-license.mjs

      - name: Windows nonpaid tests (mock-clip final merge via -c copy)
        shell: pwsh
        env:
          AI_VIDEO_FFMPEG_PATH: ${{ github.workspace }}\runtime\bin\ffmpeg.exe
        run: node --test tests/nonpaid/p14-windows-final-merge.test.mjs

      - name: Windows nonpaid tests (config init + output dirs)
        shell: pwsh
        run: |
          node --test tests/nonpaid/p14-windows-config-init.test.mjs
          node --test tests/nonpaid/p14-windows-output-dirs.test.mjs

      # P14-B7: AppData config-path consistency + node:sqlite workflow presence
      # (WF01/WF02/WF02a/WF02b/WF03 with no system sqlite3) + lifecycle/PID path.
      # Runs on a real Windows runner so node:sqlite is exercised on win32.
      - name: Windows nonpaid tests (P14-B7 config path + node:sqlite presence + lifecycle)
        shell: pwsh
        run: node --test tests/nonpaid/p14b7-windows-config-sqlite.test.mjs

      # P14-B8G: FK-safe workflow sync order — reproduces the B8F failure where
      # activeVersionId / publishedVersionId were set before the workflow_history row
      # existed, violating the FK constraint enforced by node:sqlite on win32.
      # Verifies the fix end-to-end via the real sync subprocess on a synthetic n8n-2.x
      # schema. Runs on Windows so node:sqlite (built-in since Node 24) is live.
      - name: Windows nonpaid tests (P14-B8G FK-safe workflow sync)
        shell: pwsh
        run: node --test tests/nonpaid/p14b8g-workflow-sync-fk.test.mjs

      # P14-B5: Build the Electron win32-x64 desktop shell from the freshly
      # installed node_modules/electron/dist on this Windows runner.
      - name: Build Electron shell (win32-x64, AI Video.exe + icon)
        shell: pwsh
        run: node scripts/win/build-electron-shell.mjs

      - name: Assemble portable staging tree (filter non-win32 native modules)
        shell: pwsh
        run: node scripts/win/assemble-windows-portable.mjs

      - name: Verify business assets frozen into Windows artifact
        shell: pwsh
        run: node scripts/win/verify-business-assets.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001/resources/runtime"

      # P14-B5 nonpaid: desktop shell shape checks against mock dirs (offline, no
      # model calls). Run after assemble so the real staging tree is available too.
      - name: Windows nonpaid tests (desktop shell + client-shape P14-B5)
        shell: pwsh
        run: node --test tests/nonpaid/p14-windows-desktop-shell.test.mjs

      # P14-B3/B5: enforce the small-user "client" shape (engineering tree hidden
      # under resources/runtime/; AI Video.exe at root, cmd at tools/).
      - name: Verify portable client shape (small-user layout, no project dump)
        shell: pwsh
        run: node scripts/win/check-client-shape.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001"

      # P14-B5: verify AI Video.exe is a valid win32-x64 PE and resources/app/ is present.
      - name: Verify desktop shell (AI Video.exe + Electron app code)
        shell: pwsh
        run: node scripts/win/check-desktop-shell.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001"

      - name: Verify ARTIFACT TREE native modules are win32-x64 (no darwin/linux)
        shell: pwsh
        run: node scripts/win/verify-native-modules.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001/resources/runtime/node_modules"

      - name: Verify n8n runtime completeness (artifact tree)
        shell: pwsh
        run: node scripts/win/check-n8n-runtime-completeness.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001/resources/runtime/node_modules"

      - name: n8n launch smoke (start from portable tree, no real workflow)
        shell: pwsh
        run: node scripts/win/n8n-launch-smoke.mjs "dist-win/AI-Video-Win-x64-Portable-RC-0001/resources/runtime"

      - name: Zip portable + SHA256 (only after artifact-tree verification passes)
        shell: pwsh
        run: node scripts/win/zip-windows-portable.mjs

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Win-x64-Portable-RC-0001
          path: |
            dist-win/AI-Video-Win-x64-Portable-RC-0001/
            dist-win/AI-Video-Win-x64-Portable-RC-0001.zip.sha256
            dist-win/runtime-manifest.json
          if-no-files-found: error
