name: Windows Real Smoke — Image Only (P14-B6)

# P14-B6: Manual-only real-device smoke test against the Windows portable artifact.
# Scope is limited to image generation; all video/Veo/final/review-submit/rerun-shot
# paths are blocked in real-smoke-image-only.mjs. Never auto-triggered.

# IMPORTANT: on: contains ONLY workflow_dispatch — no push, pull_request, or schedule.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of the windows-portable.yml build that produced AI-Video-Win-x64-Portable-RC-0001'
        required: false
        default: '27163429484'

permissions:
  contents: read
  actions: read

env:
  REAL_SMOKE_SCOPE: image_only
  DISABLE_VIDEO_GENERATION: 'true'

jobs:
  real-smoke-image-only:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Mask secrets immediately — before any step that could echo env vars.
      # GitHub Actions already masks secrets in logs; add-mask is belt-and-suspenders
      # for derived values and ensures masking survives any pwsh string ops below.
      - name: Mask secrets
        shell: pwsh
        run: |
          $apiKey = '${{ secrets.AI_VIDEO_API_KEY }}'
          if ($apiKey -ne '') {
            Write-Output "::add-mask::$apiKey"
          }
          $baseUrl = '${{ secrets.AI_VIDEO_BASE_URL }}'
          if ($baseUrl -ne '') {
            Write-Output "::add-mask::$baseUrl"
          }

      # Fail fast if the required secret is absent — never print the value.
      - name: Check required secrets
        shell: pwsh
        run: |
          if ('${{ secrets.AI_VIDEO_API_KEY }}' -eq '') {
            Write-Error 'Required secret AI_VIDEO_API_KEY is not set. Add it in Settings > Secrets > Actions.'
            exit 1
          }
          Write-Host 'Secret presence check: AI_VIDEO_API_KEY is set (value hidden).'
          if ('${{ secrets.AI_VIDEO_BASE_URL }}' -ne '') {
            Write-Host 'Optional AI_VIDEO_BASE_URL is set (value hidden).'
          } else {
            Write-Host 'Optional AI_VIDEO_BASE_URL not set — script will use provider default.'
          }

      - name: Syntax check smoke script (node --check)
        shell: pwsh
        run: node --check scripts/win/real-smoke-image-only.mjs

      - name: Download portable artifact from B5 run
        uses: actions/download-artifact@v4
        with:
          name: AI-Video-Win-x64-Portable-RC-0001
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist-win/AI-Video-Win-x64-Portable-RC-0001

      - name: Run real-smoke image-only safety guard (dry-run)
        shell: pwsh
        env:
          REAL_SMOKE_SCOPE: ${{ env.REAL_SMOKE_SCOPE }}
          DISABLE_VIDEO_GENERATION: ${{ env.DISABLE_VIDEO_GENERATION }}
          AI_VIDEO_API_KEY: ${{ secrets.AI_VIDEO_API_KEY }}
          AI_VIDEO_BASE_URL: ${{ secrets.AI_VIDEO_BASE_URL }}
        run: node scripts/win/real-smoke-image-only.mjs --dry-run

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-image-only
          path: |
            smoke-report.json
            diagnostics/
          if-no-files-found: warn
