name: Windows Real Smoke — Image Only (P14-B6)

# P14-B6: Manual-only real-device smoke test against the Windows portable artifact.
# Scope is limited to image generation; video and Veo operations are blocked by
# smoke-guard.mjs and enforced by smoke-image-only.mjs. Never auto-triggered.

# IMPORTANT: on: contains ONLY workflow_dispatch — no push, pull_request, or schedule.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of the windows-portable.yml build that produced AI-Video-Win-x64-Portable-RC-0001'
        required: false
        default: '27163429484'
      image_model:
        description: 'Image model override (default: nano-banana-pro)'
        required: false
        default: 'nano-banana-pro'

permissions:
  contents: read
  actions: read

env:
  REAL_SMOKE_SCOPE: image_only
  DISABLE_VIDEO_GENERATION: 'true'

jobs:
  real-smoke-image-only:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Mask secrets immediately — before any step that could echo env vars.
      # GitHub Actions already masks secrets in logs; add-mask is belt-and-suspenders
      # for derived values and ensures masking survives any pwsh string ops below.
      - name: Mask secrets
        shell: pwsh
        run: |
          $apiKey = '${{ secrets.AI_VIDEO_API_KEY }}'
          if ($apiKey -ne '') {
            Write-Output "::add-mask::$apiKey"
          }
          $baseUrl = '${{ secrets.AI_VIDEO_BASE_URL }}'
          if ($baseUrl -ne '') {
            Write-Output "::add-mask::$baseUrl"
          }

      # Fail fast if the required secret is absent — never print the value.
      - name: Check required secrets
        shell: pwsh
        run: |
          if ('${{ secrets.AI_VIDEO_API_KEY }}' -eq '') {
            Write-Error 'Required secret AI_VIDEO_API_KEY is not set. Add it in Settings > Secrets > Actions.'
            exit 1
          }
          Write-Host 'Secret presence check: AI_VIDEO_API_KEY is set (value hidden).'
          if ('${{ secrets.AI_VIDEO_BASE_URL }}' -ne '') {
            Write-Host 'Optional AI_VIDEO_BASE_URL is set (value hidden).'
          } else {
            Write-Host 'Optional AI_VIDEO_BASE_URL not set — script will use provider default.'
          }

      - name: Syntax check smoke scripts (node --check)
        shell: pwsh
        run: |
          node --check scripts/win/smoke-guard.mjs
          node --check scripts/win/smoke-image-only.mjs
          node --check scripts/win/check-smoke-security.mjs

      # Security gate: validates REAL_SMOKE_SCOPE, DISABLE_VIDEO_GENERATION, and
      # AI_VIDEO_API_KEY presence before any model call can be attempted.
      - name: Security gate (check-smoke-security.mjs)
        shell: pwsh
        env:
          REAL_SMOKE_SCOPE: ${{ env.REAL_SMOKE_SCOPE }}
          DISABLE_VIDEO_GENERATION: ${{ env.DISABLE_VIDEO_GENERATION }}
          AI_VIDEO_API_KEY: ${{ secrets.AI_VIDEO_API_KEY }}
        run: node scripts/win/check-smoke-security.mjs

      # Guard self-test: confirms all forbidden-operation guards throw before
      # any network activity happens.
      - name: Guard self-test (forbidden-operation guards must throw)
        shell: pwsh
        env:
          REAL_SMOKE_SCOPE: ${{ env.REAL_SMOKE_SCOPE }}
          DISABLE_VIDEO_GENERATION: ${{ env.DISABLE_VIDEO_GENERATION }}
        run: >-
          node -e
          "import('./scripts/win/smoke-guard.mjs').then(m => m.selfTest()).catch(e => { console.error(e.message); process.exit(1); })"

      # actions/download-artifact@v4 exhausts its internal 5-retry limit on the
      # 626 MB artifact. gh run download uses the Go CLI HTTP stack (different
      # from the @actions/artifact JS package) and is wrapped here in an
      # explicit retry loop with exponential backoff so transient network
      # failures do not immediately fail the run.
      - name: Download portable artifact from B5 run (gh CLI + retry)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifactName = 'AI-Video-Win-x64-Portable-RC-0001'
          $runId        = '${{ inputs.artifact_run_id }}'
          $outDir       = 'dist-win'
          # gh run download --dir extracts contents directly into the target dir,
          # so pass the full expected path so smoke-image-only.mjs finds it there.
          $targetDir    = Join-Path $outDir $artifactName
          $maxAttempts  = 5
          $succeeded    = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "[$attempt/$maxAttempts] Downloading '$artifactName' from run $runId -> $targetDir ..."
            # Remove any partial output from a previous attempt before retrying.
            if (Test-Path $targetDir) { Remove-Item $targetDir -Recurse -Force }
            gh run download $runId --name $artifactName --dir $targetDir
            if ($LASTEXITCODE -eq 0) { $succeeded = $true; break }
            if ($attempt -lt $maxAttempts) {
              $backoff = [math]::Min(60 * $attempt, 300)
              Write-Warning "Attempt $attempt failed (exit $LASTEXITCODE). Retrying in ${backoff}s ..."
              Start-Sleep -Seconds $backoff
            }
          }

          if (-not $succeeded) {
            Write-Error "Artifact download failed after $maxAttempts attempts."
            exit 1
          }
          if (-not (Test-Path $targetDir)) {
            Write-Error "Download reported success but '$targetDir' is missing."
            exit 1
          }

          # upload-artifact may preserve a nested directory layer depending on
          # how the B5 build staged paths. Locate exactly one 'AI Video.exe'
          # anywhere under $targetDir and use its parent as the real stage root.
          $exeFiles = Get-ChildItem -Path $targetDir -Filter 'AI Video.exe' -Recurse -File
          if ($exeFiles.Count -eq 0) {
            Write-Error "'AI Video.exe' not found anywhere under '$targetDir' — artifact may be incomplete or wrong run ID."
            exit 1
          }
          if ($exeFiles.Count -gt 1) {
            Write-Error "Found $($exeFiles.Count) copies of 'AI Video.exe' under '$targetDir': $($exeFiles.FullName -join ', ')"
            exit 1
          }
          $stageDir = $exeFiles[0].DirectoryName
          Write-Host "Stage dir resolved: $stageDir  (AI Video.exe present)"
          "AI_VIDEO_STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify business assets in downloaded artifact
        shell: pwsh
        run: node scripts/win/verify-business-assets.mjs "$env:AI_VIDEO_STAGE_DIR/resources/runtime"

      # Real smoke: scope guard and selfTest run at startup, then ONE image task
      # is submitted and polled until result. Stops after image — no Veo/video/merge.
      - name: Run image-only smoke
        shell: pwsh
        env:
          REAL_SMOKE_SCOPE: ${{ env.REAL_SMOKE_SCOPE }}
          DISABLE_VIDEO_GENERATION: ${{ env.DISABLE_VIDEO_GENERATION }}
          AI_VIDEO_API_KEY: ${{ secrets.AI_VIDEO_API_KEY }}
          AI_VIDEO_BASE_URL: ${{ secrets.AI_VIDEO_BASE_URL }}
          AI_VIDEO_IMAGE_MODEL: ${{ inputs.image_model }}
        run: node scripts/win/smoke-image-only.mjs "$env:AI_VIDEO_STAGE_DIR"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-image-only
          path: |
            smoke-report.json
            smoke-diagnostics/
          if-no-files-found: warn
